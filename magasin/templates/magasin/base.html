<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Titre par défaut{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'magasin/style.css' %}">
</head>
<body>
    <header>
        <h1>Plateforme Universitaire</h1>
        <nav>
            <a href="{% url 'accueil' %}">Accueil</a>
            {% if user.is_authenticated %}
                <a href="{% url 'tableau_de_bord' %}">Mon espace</a>
                <a href="{% url 'logout' %}">Déconnexion</a>
            {% else %}
                <a href="{% url 'connexion' %}">Connexion</a>
                <a href="{% url 'inscription' %}">Inscription</a>
            {% endif %}
        </nav>
    </header>

    <hr>

    {% block content %}{% endblock %}
</body>
</html>
